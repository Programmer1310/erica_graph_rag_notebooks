version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erica_app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - chromadb
    command: python app1.py

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    environment:
      - CHROMA_SERVER_API_ENABLED=true
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  chroma_data:
