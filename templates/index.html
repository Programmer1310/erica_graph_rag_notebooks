<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Erica: AI Tutor</title>

<style>
    :root {
        --primary1: #2A7F62;    
        --primary2: #538083;    
        --secondary1: #C3ACCE;  
        --secondary2: #DFD9E2;  
        --accent1: #89909F;     
        --accent2: #FFFFFF;     
        --neutral-dark: #3b3b3b;
        --neutral-light: #f8f8f8;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--secondary2);
        display: flex;
        justify-content: center;
        padding-top: 30px;
    }

    h1 {
        text-align: center;
        color: var(--primary1);
        margin-bottom: 20px;
    }

    #chat-container {
        width: 65%;
        max-width: 850px;
        display: flex;
        flex-direction: column;
    }

    #chatbox {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 70vh;
        overflow-y: auto;
        padding: 10px 5px;
        background: var(--neutral-light);
        border-radius: 14px;
    }

    .bubble {
        max-width: 70%;
        padding: 16px;
        border-radius: 14px;
        font-size: 16px;
        line-height: 1.45;
        word-wrap: break-word;
    }

    .bot {
        background: var(--secondary1);
        color: var(--neutral-dark);
        align-self: flex-start;
    }

    .user {
        background: var(--primary2);
        color: white;
        align-self: flex-end;
    }

    .typing {
        font-style: italic;
    }

    #input-container {
        margin-top: 25px;
        display: flex;
        gap: 10px;
        padding: 12px;
        background: var(--accent2);
        border-radius: 14px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #user-input {
        flex: 1;
        padding: 14px;
        border: 2px solid var(--primary1);
        border-radius: 10px;
        outline: none;
        font-size: 16px;
    }

    #send-btn {
        background: var(--primary1);
        color: white;
        border: none;
        padding: 0 25px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    #send-btn:hover {
        background: var(--primary2);
    }
</style>
</head>
<body>

<div id="chat-container">
    <h1>Erica: AI Tutor</h1>

    <div id="chatbox"></div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ask Erica something…" />
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender, isTyping=false) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble", sender);
        if (isTyping) bubble.classList.add("typing");
        bubble.textContent = text;
        chatbox.appendChild(bubble);
        chatbox.scrollTop = chatbox.scrollHeight;
        return bubble;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        userInput.value = "";

        const typingBubble = addMessage("...", "bot", true);

        try {
            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: text, mode: "graph_rag" })
            });
            const data = await response.json();

            typingBubble.classList.remove("typing");
            typingBubble.textContent = data.answer || "No answer received.";

        } catch (err) {
            typingBubble.classList.remove("typing");
            typingBubble.textContent = "Error connecting to server.";
            console.error(err);
        }
    }

    sendBtn.onclick = sendMessage;

    userInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });

    // Optional: welcome message
    addMessage("Hello! I'm Erica, your AI tutor. Ask me about NYU AI course concepts.", "bot");
</script>

</body>
</html>
