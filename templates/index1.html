<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Erica: AI Tutor</title>

    <style>
        :root {
            --primary1: #2A7F62;
            --primary2: #538083;
            --secondary1: #C3ACCE;
            --secondary2: #DFD9E2;
            --neutral-dark: #89909F;
            --neutral-light: #DFD9E2;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--secondary2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        h2 {
            color: var(--primary1);
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Chatbox */
        #chatbox {
            width: 60%;
            height: 520px;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            background: white;
            border: 2px solid var(--secondary1);
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }

        /* Chat bubbles */
        .user, .bot {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            max-width: 75%;
            font-size: 15.5px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .user {
            background: var(--primary2);
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: var(--secondary1);
            color: black;
            margin-right: auto;
        }

        /* Input section */
        #input-container {
            width: 60%;
            display: flex;
            margin-top: 18px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px;
            border: 2px solid var(--primary1);
            border-radius: 10px 0 0 10px;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 0 10px 10px 0;
            background: var(--primary1);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-size: 16px;
        }

        button:hover {
            background: var(--primary2);
        }

        /* Markdown formatting inside bot response */
        .bot ul, .bot ol {
            margin: 8px 0;
            padding-left: 22px;
        }

        .bot li {
            margin-bottom: 4px;
        }
    </style>
</head>

<body>

    <h2>Erica: AI Tutor</h2>

    <div id="chatbox"></div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Ask Erica something..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // Send message to backend
        async function sendMessage() {
            const query = document.getElementById("userInput").value.trim();
            if (!query) return;

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            });

            const data = await response.json();
            document.getElementById("userInput").value = "";

            updateChat(data.history);
        }

        // Update chat with formatted messages
        function updateChat(history) {
            const chatbox = document.getElementById("chatbox");
            chatbox.innerHTML = "";

            history.forEach(item => {
                chatbox.innerHTML += `<div class="user">${item.user}</div>`;
                chatbox.innerHTML += `<div class="bot">${marked.parse(item.bot)}</div>`;
            });

            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // Send on Enter key
        document.getElementById("userInput")
            .addEventListener("keypress", function (e) {
                if (e.key === "Enter") sendMessage();
            });
    </script>

</body>
</html>
