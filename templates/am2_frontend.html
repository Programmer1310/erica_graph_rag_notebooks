<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Erica: AI Tutor</title>

    <style>
        :root {
            --primary1: #2A7F62;
            --primary2: #538083;
            --secondary1: #C3ACCE;
            --secondary2: #89909F;
            --accent1: #DFD9E2;
            --neutral-dark: #1f2a2e;
            --neutral-light: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--accent1);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 30px;
        }

        h2 {
            color: var(--primary1);
            margin-bottom: 20px;
            font-size: 32px;
        }

        #chatbox {
            width: 70%;
            height: 520px;
            overflow-y: auto;
            padding: 10px;
        }

        .msg {
            margin-bottom: 22px;
            font-size: 18px;
            max-width: 75%;
            line-height: 1.45;
        }

        .user {
            color: var(--primary1);
            margin-left: auto;
            text-align: right;
            font-weight: 600;
        }

        .bot {
            color: var(--neutral-dark);
            margin-right: auto;
        }

        .thinking {
            font-size: 20px;
            color: var(--secondary2);
            margin-right: auto;
            margin-bottom: 25px;
            font-style: italic;
        }

        #input-container {
            margin-top: 10px;
            width: 70%;
            display: flex;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid var(--primary1);
            border-radius: 12px 0 0 12px;
            outline: none;
        }

        button {
            background: var(--primary1);
            color: white;
            border: 2px solid var(--primary1);
            padding: 14px 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 12px 12px 0;
            transition: 0.2s;
        }

        button:hover {
            background: var(--primary2);
        }

    </style>
</head>

<body>

<h2>Erica: AI Tutor</h2>

<div id="chatbox"></div>

<div id="input-container">
    <input type="text" id="userInput" placeholder="Ask Erica something…" />
    <button onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const chatbox = document.getElementById("chatbox");
let chatHistory = [];  // Keep full chat history

async function sendMessage() {
    const query = document.getElementById("userInput").value.trim();
    if (!query) return;

    // Add user message to history
    chatHistory.push({ user: query, bot: null });
    updateChat();

    document.getElementById("userInput").value = "";
    chatbox.scrollTop = chatbox.scrollHeight;

    // Show thinking bubble
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "...";
    chatbox.appendChild(thinking);
    chatbox.scrollTop = chatbox.scrollHeight;

    // Send query to backend
    try {
        const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: query })
        });

        const data = await res.json();
        thinking.remove();

        // Add bot response to history
        chatHistory[chatHistory.length - 1].bot = data.response;
        updateChat();

    } catch (err) {
        thinking.remove();
        chatHistory[chatHistory.length - 1].bot = "Sorry, something went wrong.";
        updateChat();
        console.error(err);
    }
}

function updateChat() {
    chatbox.innerHTML = "";
    chatHistory.forEach(entry => {
        if (entry.user) {
            chatbox.innerHTML += `<div class="msg user"><strong>You:</strong> ${entry.user}</div>`;
        }
        if (entry.bot) {
            chatbox.innerHTML += `<div class="msg bot"><strong>Erica:</strong><br>${marked.parse(entry.bot)}</div>`;
        }
    });
    chatbox.scrollTop = chatbox.scrollHeight;
}

// Enter key triggers send
document.getElementById("userInput").addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
